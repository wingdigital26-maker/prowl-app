<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prowl — Lantern + Owl ideas</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --acc:#35bdf7; --acc2:#7fdbff; --vio:#9b6dff; }
  [data-theme="night"]{ --bg:#0a0e14; --card:#141b26; --text:#eaf6ff; --dim:#8fa6bb; --border:rgba(127,219,255,.12); }
  [data-theme="day"]{ --bg:#f4f9fd; --card:#ffffff; --text:#10222f; --dim:#5c7891; --border:rgba(26,167,236,.18); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);padding:0 0 60px}
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:16px 20px 12px}
  h1{font-size:23px;font-weight:900;letter-spacing:-.5px}
  .sub{color:var(--dim);font-size:13px;margin-top:2px}
  .bar{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:8px 16px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
  .liked-box{flex:1;min-width:220px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600}
  .liked-box b{color:var(--acc)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;padding:18px 20px}
  .tile{position:relative;aspect-ratio:1;border-radius:16px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;cursor:pointer;transition:transform .12s,border-color .12s;overflow:hidden}
  .tile:hover{transform:translateY(-3px);border-color:var(--acc)}
  .tile.liked{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
  .tile svg{width:54%;height:54%;fill:var(--acc)}
  .num{position:absolute;top:6px;left:8px;font-size:11px;font-weight:800;color:var(--dim)}
  .fam{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:8.5px;font-weight:600;color:var(--dim);opacity:.85;padding:0 4px}
  .heart{position:absolute;top:5px;right:7px;font-size:13px;opacity:0;transition:opacity .12s}
  .tile.liked .heart{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Lantern + Owl ideas 🏮🦉</h1>
  <div class="sub">More in the direction of your two picks (lantern #56, owl #94). Tap the ones you like, numbers collect below.</div>
  <div class="bar">
    <button class="btn" id="themeBtn">Toggle theme</button>
    <div class="liked-box">Liked: <b id="likedList">none yet</b></div>
  </div>
</header>
